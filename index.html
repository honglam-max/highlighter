<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Math Keyboard (Transparent)</title>
  <style>
    :root{--btn:34px;--pad:6px}
    html, body{
      margin:0;
      font-family:system-ui,Segoe UI,Roboto,Arial,sans-serif;
      background:transparent; /* transparent background */
      color:#111;
    }
    .wrap{padding:6px; width: 400px;}
    .grid{display:grid; grid-template-columns: repeat(8, var(--btn)); gap:6px; align-items:center; justify-content:center}
    .btn{height:var(--btn); width:var(--btn); display:flex; align-items:center; justify-content:center;
         border:1px solid #cfd3d9; border-radius:8px; cursor:pointer; user-select:none; font-size:14px; background:#fff}
    .btn:active{transform:translateY(1px)}
    .row{display:flex; gap:6px; margin-top:6px; justify-content:center}
    .btn.wide{width:72px}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="grid">
      <div class="btn" onclick="send(' + ')">+</div>
      <div class="btn" onclick="send(' − ')">−</div>
      <div class="btn" onclick="send(' × ')">×</div>
      <div class="btn" onclick="send(' ÷ ')">÷</div>
      <div class="btn" onclick="send(' = ')">=</div>
      <div class="btn" onclick="send(' (')">(</div>
      <div class="btn" onclick="send(') ')">)</div>
      <div class="btn" onclick="send(' √')">√</div>

      <div class="btn" onclick="send(' π')">π</div>
      <div class="btn" onclick="send(' ≤ ')">≤</div>
      <div class="btn" onclick="send(' ≥ ')">≥</div>
      <div class="btn" onclick="send(' < ')">&lt;</div>
      <div class="btn" onclick="send(' > ')">&gt;</div>
      <div class="btn" onclick="send(' ± ')">±</div>
      <div class="btn" onclick="send(' ≈ ')">≈</div>
      <div class="btn" onclick="send(' ^2')">x²</div>

      <div class="btn" onclick="send(' ^3')">x³</div>
      <div class="btn" onclick="send(' _')">sub</div>
      <div class="btn" onclick="send(' / ')">/</div>
      <div class="btn" onclick="send(' , ')">,</div>
      <div class="btn" onclick="send(' ')">␣</div>
      <div class="btn" onclick="send('\\frac{ }{ }')">a⁄b</div>
      <div class="btn" onclick="send('\\sqrt{ }')">√{}</div>
      <div class="btn" onclick="send('{BACKSPACE}')">⌫</div>
    </div>
    <div class="row">
      <div class="btn wide" onclick="send('{LEFT}')">←</div>
      <div class="btn wide" onclick="send('{RIGHT}')">→</div>
      <div class="btn wide" onclick="send('{CLEAR}')">Clear</div>
    </div>
  </div>
<script>
  function send(text){
    try{ parent.postMessage({ type: "MATH_KEY", text: text }, "*"); }catch(e){}
  }
</script>
</body>
</html>
